<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Steven Emmanuel Gnoto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: a senior analyst's own drawing board: precise, confident, personal.
   IDEA: an architect's blueprint; Steven is the start event of the process that ends "in production".
   PICTURE: full-width blueprint grid, white line process with his photo as the start node.
   COLOUR and TYPE: ink navy, paper white, blueprint blue, Ivorian orange as the only accent; Schibsted Grotesk + Source Sans 3.
   LAYOUT: blueprint hero, KPI ledger, business-tech bridge, case ledger, document viewer, engagement path, contact. */
:root{color-scheme:light;--ink:#0b1730;--paper:#fbfaf7;--blue:#1e4fd0;--bp:#0f2a5c;--line:#d9dee8;--mut:#4b5872;--or:#f07f13;--soft:#f1f3f8}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 "Source Sans 3",system-ui,sans-serif;overflow-x:clip}
a{color:inherit}
h1,h2,h3{font-family:"Schibsted Grotesk",system-ui,sans-serif;line-height:1.08;text-wrap:balance;margin:0}
h2{font-size:clamp(30px,3.6vw,46px);font-weight:800;letter-spacing:-.01em}
h3{font-size:20px;font-weight:700}
p{margin:0}
.wrap{max-width:1200px;margin:0 auto}
.band{padding:clamp(44px,6vw,96px) max(5vw,18px)}
.lead{color:var(--mut);font-size:18px;max-width:60ch;margin-top:14px}
.hd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end;margin-bottom:34px}
.hd .lead{margin-top:10px}
html{scroll-padding-top:70px;scroll-behavior:smooth}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 24px;border-radius:4px;font-family:"Schibsted Grotesk",system-ui,sans-serif;font-weight:700;font-size:16px;text-decoration:none;border:2px solid currentColor}
.btn.or{background:var(--or);border-color:var(--or);color:#16130f}
.btn.ln{color:#fff}
.btn.dk{background:var(--ink);border-color:var(--ink);color:#fff}
.btn:focus-visible,button:focus-visible{outline:3px solid var(--or);outline-offset:3px}
/* nav */
nav{position:sticky;top:0;z-index:9;background:var(--bp);color:#fff;border-bottom:1px solid rgba(255,255,255,.12)}
nav .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px max(5vw,18px)}
.brand{font-family:"Schibsted Grotesk",system-ui,sans-serif;font-weight:800;text-decoration:none;margin-right:auto;display:flex;align-items:center;gap:10px}
.brand i{width:12px;height:12px;border-radius:50%;border:2px solid var(--or);display:inline-block}
.links{display:flex;gap:20px;flex-wrap:wrap}
.links a{text-decoration:none;opacity:.8;font-size:15px;padding:10px 0}
.links a:hover{opacity:1;color:var(--or)}
.lang{display:flex;gap:4px}
.lang button{all:unset;cursor:pointer;padding:8px 11px;font-size:14px;font-weight:600;border-radius:4px;opacity:.75;min-height:28px}
.lang button[aria-pressed=true]{background:#fff;color:var(--bp);opacity:1}
@media(max-width:760px){.links{display:none}}
/* hero blueprint */
.hero{background:var(--bp);color:#fff;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.07) 1px,transparent 1px),linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:120px 120px,120px 120px,24px 24px,24px 24px}
.hero .wrap{position:relative;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(28px,5vw,70px);align-items:center;padding:clamp(40px,6vw,90px) max(5vw,18px) clamp(36px,5vw,72px)}
.kick{display:inline-flex;align-items:center;gap:10px;font-weight:600;color:#ffd2a6;margin-bottom:18px}
.kick::before{content:"";width:28px;height:2px;background:var(--or)}
.hero h1{font-size:clamp(36px,5vw,62px);font-weight:800;letter-spacing:-.02em}
.hero .lead{color:#c7d3ee}
.ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.meta{display:flex;gap:18px;flex-wrap:wrap;margin-top:26px;font-size:14px;color:#aebddf}
.meta span::before{content:"◆ ";color:var(--or)}
/* drawing */
.draw{position:relative;border:1px solid rgba(255,255,255,.35);padding:22px 20px 18px;background:rgba(10,24,54,.55)}
.draw .cap{position:absolute;top:-11px;left:16px;background:var(--bp);padding:0 8px;font-size:13px;color:#aebddf}
.draw .stamp{position:absolute;right:14px;bottom:-12px;background:var(--bp);padding:0 8px;font-size:12px;color:#aebddf}
.start{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.start img{width:96px;height:96px;border-radius:50%;object-fit:cover;object-position:50% 50%;border:3px solid var(--or);box-shadow:0 0 0 6px rgba(240,127,19,.18)}
.start b{display:block;font-family:"Schibsted Grotesk",system-ui,sans-serif;font-size:18px}
.start small{color:#aebddf;font-size:14px}
.pl{display:grid;grid-template-columns:70px minmax(0,1fr);border-top:1px dashed rgba(255,255,255,.3)}
.pl>b{font-size:12.5px;font-weight:600;color:#ffd2a6;padding:14px 8px 0 0}
.chain{display:flex;flex-wrap:wrap;align-items:center;row-gap:12px;padding:12px 0 14px}
.nd{font-size:14px;line-height:1.25;padding:8px 11px;border:1.5px solid #fff;border-radius:6px;max-width:150px;text-align:center;background:var(--bp)}
.nd.gw{border-style:dashed}
.nd.end{border:3px solid var(--or);border-radius:999px;font-weight:600}
.cn{flex:0 0 20px;height:1.5px;background:#fff;position:relative;margin:0 3px}
.cn::after{content:"";position:absolute;right:-1px;top:-4px;border:4.5px solid transparent;border-left:7px solid #fff}
@media(max-width:920px){.hero .wrap{grid-template-columns:1fr}}
@media(max-width:440px){.pl{grid-template-columns:1fr}.pl>b{padding-top:10px}}
/* ledger */
.ledger{background:var(--ink);color:#fff}
.ledger .wrap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.ledger div{padding:30px 22px;border-left:1px solid rgba(255,255,255,.14)}
.ledger div:first-child{border-left:0}
.ledger b{display:block;font-family:"Schibsted Grotesk",system-ui,sans-serif;font-size:clamp(34px,4vw,52px);font-weight:800;line-height:1}
.ledger b em{font-style:normal;color:var(--or)}
.ledger p{margin-top:10px;font-size:15px;color:#b9c4dc}
@media(max-width:900px){.ledger .wrap{grid-template-columns:repeat(2,minmax(0,1fr))}.ledger div{border-left:0;border-top:1px solid rgba(255,255,255,.14)}}
/* bridge */
.bridge{margin-top:8px;border:1px solid var(--line);background:#fff}
.bh,.br{display:grid;grid-template-columns:minmax(0,1fr) 64px minmax(0,1fr)}
.bh{background:var(--soft);border-bottom:1px solid var(--line)}
.bh div{padding:18px 22px}
.bh h3{font-size:24px}
.bh small{display:block;color:var(--blue);font-weight:600;font-size:15px;margin-top:2px}
.bh .mid,.br .mid{position:relative}
.bh .mid::before{content:"⇄";position:absolute;inset:0;display:grid;place-items:center;font-size:24px;color:var(--or);font-weight:700}
.br{border-top:1px solid var(--line)}
.br:first-of-type{border-top:0}
.br div{padding:14px 22px}
.br .mid::before{content:"";position:absolute;left:12px;right:12px;top:50%;height:2px;background:var(--or)}
.br .mid::after{content:"";position:absolute;left:50%;top:50%;width:10px;height:10px;margin:-5px;border-radius:50%;background:#fff;border:2px solid var(--or)}
@media(max-width:700px){.bh,.br{grid-template-columns:1fr}.bh .mid,.br .mid{display:none}.br div:last-child{border-top:1px dashed var(--line);color:var(--blue)}}
/* sectors */
.sect{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:2px solid var(--ink)}
.sect div{padding:22px 22px 6px 0;margin-right:22px}
.sect h3{display:flex;gap:10px;align-items:baseline}
.sect h3::before{content:"";flex:none;width:10px;height:10px;background:var(--or);transform:rotate(45deg)}
.sect p{color:var(--mut);margin-top:8px}
@media(max-width:820px){.sect{grid-template-columns:1fr}.sect div{border-bottom:1px solid var(--line);padding-bottom:18px}}
/* cases ledger */
.soft{background:var(--soft)}
.cases{border-top:2px solid var(--ink)}
.case{display:grid;grid-template-columns:170px minmax(0,1.3fr) minmax(0,1.4fr) minmax(0,.9fr);gap:24px;padding:24px 0;border-bottom:1px solid var(--line);align-items:start}
.case .tag{font-size:14px;font-weight:600;color:var(--blue)}
.case .cl{display:block;font-size:14.5px;color:var(--mut);margin-top:6px}
.case p{color:#26324a}
.case .res{font-family:"Schibsted Grotesk",system-ui,sans-serif;font-weight:700;color:var(--ink);border-left:3px solid var(--or);padding-left:12px}
@media(max-width:980px){.case{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
@media(max-width:600px){.case{grid-template-columns:1fr;gap:10px}}
/* viewer */
.viewer{display:grid;grid-template-columns:260px minmax(0,1fr);border:1px solid var(--line);background:#fff;box-shadow:0 30px 60px -40px rgba(11,23,48,.5)}
.tabs{display:flex;flex-direction:column;background:var(--ink);padding:10px}
.tabs button{all:unset;cursor:pointer;color:#c7d3ee;padding:13px 14px;font-size:15px;font-weight:600;border-left:3px solid transparent;min-height:20px}
.tabs button[aria-selected=true]{color:#fff;border-left-color:var(--or);background:rgba(255,255,255,.07)}
.panel{padding:clamp(20px,3vw,34px)}
.panel h3{font-size:23px}.panel .note{font-size:14px;color:var(--mut);margin:6px 0 18px}
.panel h4{margin:22px 0 8px;font-size:16px;font-family:"Schibsted Grotesk",system-ui,sans-serif}
.panel table{width:100%;border-collapse:collapse;font-size:15px}
.panel th,.panel td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;vertical-align:top}
.panel th{background:var(--soft);font-weight:600}
.panel pre{background:var(--ink);color:#dce6ff;padding:14px;font-size:13.5px;line-height:1.5;margin:0;border-left:3px solid var(--or)}
.panel ul{margin:0;padding-left:20px;display:grid;gap:6px}
.ep{display:inline-block;font-family:ui-monospace,Menlo,monospace;font-size:14px;background:var(--soft);border:1px solid var(--line);padding:6px 10px;overflow-wrap:anywhere}
.flow{display:flex;flex-wrap:wrap;align-items:center;row-gap:10px;margin-top:6px}
.flow .st{font-size:14px;padding:8px 11px;border:1.5px solid var(--blue);border-radius:6px;max-width:180px}
.flow .st.bad{border-color:#c93c3c;color:#8f1f1f}
.flow .ar{flex:0 0 20px;height:1.5px;background:var(--blue);position:relative;margin:0 3px}
.flow .ar::after{content:"";position:absolute;right:-1px;top:-4px;border:4.5px solid transparent;border-left:7px solid var(--blue)}
.gain{margin-top:18px;padding:12px 14px;background:#fff4e8;border-left:3px solid var(--or);font-weight:600}
.scroll{overflow-x:auto}
@media(max-width:820px){.viewer{grid-template-columns:1fr}.tabs{flex-direction:row;overflow-x:auto}.tabs button{flex:none;border-left:0;border-bottom:3px solid transparent}.tabs button[aria-selected=true]{border-bottom-color:var(--or)}}
/* chips */
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:44px}
@media(max-width:780px){.two{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chips span{border:1px solid var(--line);background:#fff;padding:6px 11px;font-size:15px}
/* path */
.path{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px;position:relative;margin-top:10px}
.path::before{content:"";position:absolute;left:0;right:0;top:15px;height:2px;background:var(--ink)}
.stp{position:relative;padding-top:42px;display:flex;flex-direction:column;gap:8px}
.stp::before{content:"";position:absolute;top:6px;left:0;width:18px;height:18px;border-radius:50%;background:var(--paper);border:3px solid var(--ink)}
.stp.free::before{background:var(--or);border-color:var(--or)}
.stp .d{font-size:14px;font-weight:600;color:var(--blue)}
.stp.free .d{color:#b85a00}
.stp p{color:var(--mut)}
.stp a{margin-top:auto;align-self:flex-start}
@media(max-width:900px){.path{grid-template-columns:1fr}.path::before{left:8px;right:auto;width:2px;top:0;bottom:0;height:auto}.stp{padding:0 0 10px 38px}.stp::before{top:2px}}
.svc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px}
.svc div{border-top:1px solid var(--ink);padding-top:14px}
.svc p{color:var(--mut);margin-top:6px}
@media(max-width:900px){.svc{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.svc{grid-template-columns:1fr}}
.list{display:grid;gap:16px;margin-top:18px}
.list div{border-left:3px solid var(--or);padding-left:14px}
.list small{display:block;color:var(--mut);font-size:15px}
/* contact */
.contact{background:var(--bp);color:#fff;position:relative;overflow:hidden}
.contact::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:24px 24px}
.contact .wrap{position:relative}
.contact .lead{color:#c7d3ee}
.cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin-top:30px;border:1px solid rgba(255,255,255,.35)}
.cgrid a{display:block;text-decoration:none;padding:20px;border-left:1px solid rgba(255,255,255,.35);background:rgba(10,24,54,.55)}
.cgrid a:first-child{border-left:0}
.cgrid a:hover{background:rgba(240,127,19,.15)}
.cgrid small{display:block;color:#aebddf;font-size:14px}
.cgrid b{font-family:"Schibsted Grotesk",system-ui,sans-serif;font-size:17px;overflow-wrap:anywhere}
@media(max-width:780px){.cgrid{grid-template-columns:1fr}.cgrid a{border-left:0;border-top:1px solid rgba(255,255,255,.35)}.cgrid a:first-child{border-top:0}}
footer{padding:22px max(5vw,18px);font-size:14px;color:var(--mut);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;max-width:1200px;margin:0 auto}
</style>
</head>
